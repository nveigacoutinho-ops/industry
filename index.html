<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SEIVA — Links</title>
<meta name="description" content="SEIVA — Website, LinkedIn and Save a Forest.">
<link rel="icon" href="assets/seiva-mark.svg" type="image/svg+xml">
<style>
  :root {
    --bg-0: #04120b;
    --bg-1: #071d12;
    --line: #1f5c39;
    --node: #7fe8a4;
    --card-bg: rgba(10, 30, 20, 0.55);
    --card-border: rgba(127, 232, 164, 0.18);
    --text: #eafaf0;
    --text-dim: #9fc9ae;
    --focus: #7fe8a4;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100dvh;
    background: var(--bg-0);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    justify-content: center;
    min-height: 100dvh;
    overflow-x: hidden;
  }

  canvas#bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    background:
      radial-gradient(ellipse at 50% 0%, var(--bg-1) 0%, var(--bg-0) 60%);
  }

  .vignette {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse at 50% 40%, transparent 30%, rgba(2, 8, 5, 0.75) 100%);
  }

  main {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 440px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 48px 24px 32px;
  }

  .brand {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    margin-bottom: 40px;
  }

  .brand img {
    width: 84px;
    height: auto;
    filter: drop-shadow(0 0 22px rgba(69, 193, 81, 0.35)) drop-shadow(0 0 10px rgba(217, 89, 28, 0.25));
  }

  .brand .wordmark {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: 0.12em;
    color: #ffffff;
  }

  .brand .tagline {
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
    text-align: center;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .link-btn {
    position: relative;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    min-height: 60px;
    padding: 14px 20px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    color: var(--text);
    text-decoration: none;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.01em;
    transition: transform 150ms ease, border-color 150ms ease, background 150ms ease;
    cursor: pointer;
  }

  .link-btn:hover {
    border-color: rgba(127, 232, 164, 0.5);
    background: rgba(15, 42, 28, 0.7);
    transform: translateY(-2px);
  }

  .link-btn:active {
    transform: translateY(0);
  }

  .link-btn:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 3px;
  }

  .link-btn .icon {
    flex: 0 0 auto;
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--node);
  }

  .link-btn .icon svg {
    width: 100%;
    height: 100%;
  }

  .link-btn .label {
    flex: 1 1 auto;
  }

  .link-btn .chevron {
    flex: 0 0 auto;
    width: 18px;
    height: 18px;
    color: var(--text-dim);
    opacity: 0.7;
  }

  .link-btn.forest {
    border-color: rgba(217, 89, 28, 0.25);
  }

  .link-btn.forest:hover {
    border-color: rgba(217, 89, 28, 0.55);
  }

  .link-btn.forest .icon {
    color: #e2874a;
  }

  footer {
    margin-top: auto;
    padding-top: 40px;
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
  }

  @media (min-width: 640px) {
    main {
      padding-top: 72px;
    }
    .brand img {
      width: 96px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    canvas#bg { display: none; }
    html, body { background: var(--bg-0); }
  }
</style>
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <main>
    <div class="brand">
      <img src="assets/seiva-mark.svg" alt="SEIVA">
      <span class="wordmark">SEIVA</span>
      <span class="tagline">The forest nervous system</span>
    </div>

    <nav class="links" aria-label="SEIVA links">
      <a class="link-btn" href="#" target="_blank" rel="noopener">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.7-3.8-9s1.3-6.4 3.8-9z"/>
          </svg>
        </span>
        <span class="label">Website</span>
        <span class="chevron" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </a>

      <a class="link-btn" href="#" target="_blank" rel="noopener">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M4.98 3.5C4.98 4.88 3.87 6 2.49 6S0 4.88 0 3.5 1.11 1 2.49 1s2.49 1.12 2.49 2.5zM.5 8.25h4v14.75h-4zM8.5 8.25h3.83v2.02h.05c.53-1 1.84-2.06 3.79-2.06 4.05 0 4.8 2.67 4.8 6.14v8.65h-4v-7.67c0-1.83-.03-4.18-2.55-4.18-2.55 0-2.94 1.99-2.94 4.05v7.8h-4z"/>
          </svg>
        </span>
        <span class="label">LinkedIn</span>
        <span class="chevron" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </a>

      <a class="link-btn forest" href="#" target="_blank" rel="noopener">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22V13"/>
            <path d="M12 13c0-4.5-3-7-7-7 0 4.5 3 7 7 7z"/>
            <path d="M12 13c0-5 3.5-8 8-8 0 5-3.5 8-8 8z"/>
          </svg>
        </span>
        <span class="label">Save a Forest</span>
        <span class="chevron" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </span>
      </a>
    </nav>

    <footer>&copy; <span id="year"></span> SEIVA. All rights reserved.</footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    (function () {
      var canvas = document.getElementById('bg');
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion || !canvas) return;

      var ctx = canvas.getContext('2d');
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var w, h, nodes;

      function resize() {
        w = window.innerWidth;
        h = window.innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        buildNodes();
      }

      function buildNodes() {
        var count = Math.round((w * h) / 26000);
        count = Math.max(24, Math.min(count, 90));
        nodes = [];
        for (var i = 0; i < count; i++) {
          nodes.push({
            x: Math.random() * w,
            y: Math.random() * h,
            vx: (Math.random() - 0.5) * 0.12,
            vy: (Math.random() - 0.5) * 0.12,
            r: Math.random() * 1.4 + 0.6,
            glow: Math.random() > 0.85
          });
        }
      }

      var linkDist = 150;

      function step() {
        ctx.clearRect(0, 0, w, h);

        for (var i = 0; i < nodes.length; i++) {
          var n = nodes[i];
          n.x += n.vx;
          n.y += n.vy;
          if (n.x < 0 || n.x > w) n.vx *= -1;
          if (n.y < 0 || n.y > h) n.vy *= -1;
        }

        for (var i = 0; i < nodes.length; i++) {
          for (var j = i + 1; j < nodes.length; j++) {
            var a = nodes[i], b = nodes[j];
            var dx = a.x - b.x, dy = a.y - b.y;
            var dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < linkDist) {
              var alpha = (1 - dist / linkDist) * 0.35;
              ctx.strokeStyle = 'rgba(63, 168, 105,' + alpha + ')';
              ctx.lineWidth = 0.6;
              ctx.beginPath();
              ctx.moveTo(a.x, a.y);
              ctx.lineTo(b.x, b.y);
              ctx.stroke();
            }
          }
        }

        for (var i = 0; i < nodes.length; i++) {
          var n = nodes[i];
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          ctx.fillStyle = n.glow ? 'rgba(140, 240, 170, 0.9)' : 'rgba(90, 190, 130, 0.55)';
          if (n.glow) {
            ctx.shadowColor = 'rgba(120, 230, 160, 0.9)';
            ctx.shadowBlur = 8;
          } else {
            ctx.shadowBlur = 0;
          }
          ctx.fill();
        }

        requestAnimationFrame(step);
      }

      window.addEventListener('resize', resize);
      resize();
      requestAnimationFrame(step);
    })();
  </script>
</body>
</html>
